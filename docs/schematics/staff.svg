<text x="630.0" y="179.8" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#555555">handle on top</text>
<text x="40.0" y="140.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#555555">Nothing metal below 750 mm:</text>
<text x="40.0" y="157.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#555555">nylon zip ties, wood, glue, tape.</text>
