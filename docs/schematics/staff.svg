<text x="980.0" y="480.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#555555">Face along the cable, board face toward you.</text>
<text x="980.0" y="496.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#555555">Step left/right across it; the arrow on the</text>
<text x="980.0" y="512.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#555555">screen points the way to go.</text>
