<text x="86.0" y="388.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#555555">Interface: MIX fully to PLAYBACK, MAIN at about 3 o&#x27;clock.</text>
<text x="86.0" y="404.2" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#555555">calibrate.py plays the tone itself: 90 Hz, then 8 kHz, then 33 kHz.</text>
<text x="70.0" y="520.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#555555">Why a loop and not one straight wire: a loop needs no ground</text>
<text x="70.0" y="537.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#555555">stakes (dry ground can be hundreds of ohms) and takes little</text>
<text x="70.0" y="555.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#555555">current. Its far side and ends DO bend the field the coils see,</text>
<text x="70.0" y="572.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#555555">by 15 to 40 % on the vertical coils, so the software calculates</text>
<text x="70.0" y="590.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#555555">all four sides with the finite-wire Biot-Savart formula.</text>
<text x="70.0" y="607.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#555555"></text>
<text x="70.0" y="625.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#555555">If your loop isn&#x27;t exactly 9 m x 5 m, measure it and set</text>
<text x="70.0" y="642.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#555555">CAL_LOOP_LENGTH and CAL_LOOP_WIDTH in locator/config.py.</text>
