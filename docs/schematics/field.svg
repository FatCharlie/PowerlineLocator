<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760">
<rect x="0.0" y="0.0" width="1300.0" height="760.0" rx="0" fill="white" stroke="none" stroke-width="2"/>
<text x="24.0" y="40.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" text-anchor="start" font-weight="bold" fill="#222">What the four coils see</text>
