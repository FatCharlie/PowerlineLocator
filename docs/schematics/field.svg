<line x1="0.0" y1="380.0" x2="1300.0" y2="380.0" stroke="#8b7355" stroke-width="3" stroke-linecap="round"/>
<circle cx="470.0" cy="640.0" r="60.0" fill="none" stroke="#7fb3d5" stroke-width="1.6"/>
