<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="640" viewBox="0 0 1300 640">
<rect x="0.0" y="0.0" width="1300.0" height="640.0" rx="0" fill="white" stroke="none" stroke-width="2"/>
<text x="24.0" y="40.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" text-anchor="start" font-weight="bold" fill="#222">The clamp: puts the signal on a cable with no contact at all</text>
<circle cx="373.0" cy="334.0" r="150.0" fill="none" stroke="#444" stroke-width="46"/>
<line x1="190.0" y1="334.0" x2="556.0" y2="334.0" stroke="white" stroke-width="8" stroke-linecap="round"/>
<text x="373.0" y="540.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#222">two Fair-Rite 0431177081 split cores, stacked back to back</text>
<text x="373.0" y="557.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#222">(end-on they look like one ring; the split runs across the middle)</text>
<circle cx="373.0" cy="334.0" r="46.0" fill="#111" stroke="#222" stroke-width="2"/>
<text x="373.0" y="340.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="white">cable</text>
<circle cx="237.1" cy="270.6" r="30.0" fill="none" stroke="#c87533" stroke-width="3"/>
<circle cx="254.8" cy="241.7" r="30.0" fill="none" stroke="#c87533" stroke-width="3"/>
<circle cx="278.6" cy="217.4" r="30.0" fill="none" stroke="#c87533" stroke-width="3"/>
<circle cx="307.2" cy="199.2" r="30.0" fill="none" stroke="#c87533" stroke-width="3"/>
<circle cx="339.3" cy="187.8" r="30.0" fill="none" stroke="#c87533" stroke-width="3"/>
<circle cx="373.0" cy="184.0" r="30.0" fill="none" stroke="#c87533" stroke-width="3"/>
<circle cx="406.7" cy="187.8" r="30.0" fill="none" stroke="#c87533" stroke-width="3"/>
<circle cx="438.8" cy="199.2" r="30.0" fill="none" stroke="#c87533" stroke-width="3"/>
<circle cx="467.4" cy="217.4" r="30.0" fill="none" stroke="#c87533" stroke-width="3"/>
<circle cx="491.2" cy="241.7" r="30.0" fill="none" stroke="#c87533" stroke-width="3"/>
<text x="373.0" y="130.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#222">10 turns of 20 AWG wire around ONE half,</text>
<text x="373.0" y="147.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#222">through the hole and back round the outside</text>
<polyline points="240.0,250.0 160.0,210.0 130.0,210.0" fill="none" stroke="#d62728" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="520.0,240.0 660.0,190.0 880.0,190.0" fill="none" stroke="#222222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="122.0" y="215.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" text-anchor="end" font-weight="bold" fill="#222">to RED</text>
<text x="890.0" y="195.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#222">to BLACK (no stake needed)</text>
<text x="780.0" y="300.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#555555">How it works: the clamp is a transformer.</text>
<text x="780.0" y="317.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#555555">Its 10 turns are the primary; the cable inside</text>
<text x="780.0" y="335.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#555555">is a 1-turn secondary. Volts on the cable</text>
<text x="780.0" y="352.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#555555">= drive volts / 10. Current flows round the loop</text>
<text x="780.0" y="370.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#555555">made by the cable, its grounds at both ends</text>
<text x="780.0" y="387.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#555555">and the earth between them.</text>
<text x="780.0" y="470.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#555555">Fits cables up to 25 mm (1 in) across.</text>
<text x="780.0" y="487.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#555555">Steel conduit blocks it; PVC conduit doesn&#x27;t.</text>
<text x="780.0" y="505.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#555555">Use 33 kHz: it couples best.</text>
</svg>
